<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue components</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="nav-bar"></div>

      <h1>{{ intro }}</h1>
      <book-add :header-text="headerText" @add-book-event="AddBook"></book-add> 
      <h1>_____________________________</h1>
      <h2>Show all the books</h2>

      <book-details :book-list="books"></book-details>

    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>
    <script src="./components/book_details.js"></script>
    <script src="./components/addBook_details.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
